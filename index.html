<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protótipo - Terra Vivo</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --bg-color: #f5f5f5;
            --sidebar-bg: #ffffff;
            --text-color: #333333;
            --sidebar-width: 280px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .menu-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
        }

        .menu-item:hover {
            background-color: #f9f9f9;
        }

        .menu-item.active {
            background-color: #e8f5e9;
            border-left: 4px solid var(--primary-color);
            padding-left: 16px;
            font-weight: bold;
        }

        .menu-item span {
            font-size: 0.95rem;
            color: var(--text-color);
        }

        /* Main Content Styles */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #e0e0e0;
        }

        .top-bar {
            height: 60px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            z-index: 5;
        }

        .screen-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #388E3C;
        }

        .prototype-container {
            flex-grow: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px;
        }

        .prototype-image {
            max-width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background-color: white;
            transition: opacity 0.3s ease;
        }

        /* Overlay text for empty state */
        .empty-state {
            display: none;
            text-align: center;
            color: #777;
            margin-top: 20%;
        }

        /* Mobile toggle */
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-color);
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: -280px;
                height: 100%;
                transition: left 0.3s ease;
            }
            
            .sidebar.open {
                left: 0;
            }

            .mobile-toggle {
                display: block;
            }
            
            .prototype-container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Terra Vivo</h2>
            <div style="font-size: 0.8rem; margin-top: 5px; opacity: 0.8;">Protótipo Navegável</div>
        </div>
        <ul class="menu-list" id="menuList">
            <!-- Items injected by JS -->
        </ul>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
            <div class="screen-title" id="screenTitle">Selecione uma tela</div>
            <div class="controls">
                <button class="btn" onclick="prevScreen()">Anterior</button>
                <button class="btn" onclick="nextScreen()">Próxima</button>
            </div>
        </div>
        
        <div class="prototype-container" id="imageContainer">
            <img src="" id="prototypeImage" class="prototype-image" style="display: none;" alt="Tela do protótipo">
            <div class="empty-state" id="emptyState">
                <h3>Bem-vindo ao protótipo</h3>
                <p>Selecione uma tela no menu lateral para visualizar.</p>
            </div>
        </div>
    </div>

    <script>
        // List of all images in the directory
        const screens = [
            { id: 'login', name: 'Login', file: 'login.png' },
            { id: 'home', name: 'Home / Dashboard', file: 'home.png' },
            { id: 'menu-2', name: 'Menu Secundário', file: 'menu-2.png' },
            { id: 'categorias-loja', name: 'Categorias (Loja)', file: 'categorias-loja.png' },
            { id: 'categorias-pno', name: 'Categorias (PNO)', file: 'categorias-pno.png' },
            { id: 'ofertas-1', name: 'Ofertas - Tela 1', file: 'ofertas-1.png' },
            { id: 'ofertas-2', name: 'Ofertas - Tela 2', file: 'ofertas-2.png' },
            { id: 'banners-lista', name: 'Banners - Lista', file: 'banners-lista.png' },
            { id: 'banner-novo', name: 'Banners - Novo', file: 'banner-novo.png' },
            { id: 'carrousel-1', name: 'Carrossel 1', file: 'carrousel-1.png' },
            { id: 'carrousel-2', name: 'Carrossel 2', file: 'carrousel-2.png' },
            { id: 'novo-pno-1', name: 'Novo PNO - Passo 1', file: 'novo-pno-1.png' },
            { id: 'novo-pno-2', name: 'Novo PNO - Passo 2', file: 'novo-pno-2.png' },
            { id: 'edicao-pno-1', name: 'Edição PNO - Tela 1', file: 'edicao-pno-1.png' },
            { id: 'edicao-pno-2', name: 'Edição PNO - Tela 2', file: 'edicao-pno-2.png' },
            { id: 'documentacao-1', name: 'Documentação 1', file: 'documentacao-1.png' },
            { id: 'documentacao-2', name: 'Documentação 2', file: 'documentacao-2.png' },
            { id: 'multimidia', name: 'Multimídia', file: 'multimidia.png' }
        ];

        let currentIndex = 0;

        // Initialize menu
        function initMenu() {
            const menuList = document.getElementById('menuList');
            
            screens.forEach((screen, index) => {
                const li = document.createElement('li');
                li.className = 'menu-item';
                li.id = `menu-item-${index}`;
                li.innerHTML = `<span>${index + 1}. ${screen.name}</span>`;
                li.onclick = () => loadScreen(index);
                menuList.appendChild(li);
            });

            // Load first screen by default
            if (screens.length > 0) {
                loadScreen(0);
            }
        }

        // Load a specific screen
        function loadScreen(index) {
            if (index < 0 || index >= screens.length) return;
            
            currentIndex = index;
            const screen = screens[index];
            
            // Update active menu item
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`menu-item-${index}`).classList.add('active');
            
            // Update title
            document.getElementById('screenTitle').textContent = `${index + 1}. ${screen.name}`;
            
            // Update image
            const img = document.getElementById('prototypeImage');
            const emptyState = document.getElementById('emptyState');
            
            img.style.opacity = 0;
            
            setTimeout(() => {
                img.src = screen.file;
                img.style.display = 'block';
                emptyState.style.display = 'none';
                
                img.onload = () => {
                    img.style.opacity = 1;
                };
            }, 150);

            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function prevScreen() {
            if (currentIndex > 0) {
                loadScreen(currentIndex - 1);
            }
        }

        function nextScreen() {
            if (currentIndex < screens.length - 1) {
                loadScreen(currentIndex + 1);
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Handle keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextScreen();
            if (e.key === 'ArrowLeft') prevScreen();
        });

        // Initialize on load
        window.onload = initMenu;
    </script>
</body>
</html>
