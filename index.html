<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movistar Store - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#019DF4', // Movistar Blue
                        secondary: '#5BC500', // Green button
                        dark: '#333333',
                        lightbg: '#F3F4F6'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-300 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Logo top -->
    <div class="mb-8">
        <h1 class="text-4xl font-light text-primary tracking-wide bg-white px-6 py-2 rounded shadow-sm">
            Movistar <span class="font-semibold italic">Store</span>
        </h1>
    </div>

    <!-- Login Card -->
    <div class="glass-card w-full max-w-md rounded-2xl p-8 transition-transform duration-300 hover:shadow-xl">
        <h2 class="text-2xl font-semibold text-center text-gray-800 mb-8">Terra Networks</h2>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <!-- User ID -->
            <div class="mb-5 relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-user text-gray-400"></i>
                </div>
                <input type="text" id="userId" 
                    class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all bg-yellow-50"
                    placeholder="ID do Usuário" value="81021595" required>
            </div>

            <!-- Password -->
            <div class="mb-4 relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-lock text-gray-400"></i>
                </div>
                <input type="password" id="password" 
                    class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all bg-yellow-50"
                    placeholder="Senha" value="............." required>
            </div>

            <!-- Checkbox -->
            <div class="flex items-center justify-center mb-6">
                <input type="checkbox" id="usuarioTerra" class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary">
                <label for="usuarioTerra" class="ml-2 text-sm text-gray-600 cursor-pointer">Usuario Terra</label>
            </div>

            <hr class="border-gray-200 mb-6">

            <!-- Captcha Area -->
            <div class="flex flex-col items-center mb-6">
                <div class="bg-gray-100 px-8 py-3 rounded tracking-widest text-2xl font-bold text-gray-700 relative overflow-hidden mb-2 select-none" style="font-family: 'Courier New', Courier, monospace; letter-spacing: 0.3em;">
                    <!-- Fake noise lines -->
                    <div class="absolute inset-0 flex items-center justify-center opacity-30">
                        <svg width="100%" height="100%"><path d="M0,20 Q50,40 100,10 T150,30" stroke="black" fill="none" stroke-width="2"/></svg>
                    </div>
                    C<span class="text-gray-500">A</span>A<span class="text-gray-800">D</span>A
                </div>
                <label class="text-sm text-gray-600 font-medium mb-3">Código de Seguridad</label>
                <input type="text" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-center focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-all"
                    placeholder="Insira o código acima">
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                class="w-full bg-secondary hover:bg-green-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 flex justify-center items-center gap-2">
                <span>Ingresar</span>
                <i class="fas fa-sign-in-alt"></i>
            </button>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            // Simple visual effect before redirecting
            const btn = e.target.querySelector('button[type="submit"]');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Entrando...';
            btn.disabled = true;
            
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 600);
        }
    </script>
</body>
</html>
